<!doctype html>
<!-- lang is a placeholder: i18n.js sets it from the resolved language on boot. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Booki</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="dock-body edge-bottom show-labels booting">
    <nav class="dock" id="dock" aria-label="Booki dock"></nav>

    <div class="drop-overlay" id="drop-overlay">
      <div class="pill" id="drop-pill"></div>
    </div>

    <button class="update-pill hidden" id="update-pill"></button>

    <div class="undo-toast hidden" id="undo-toast" role="status" aria-live="polite"></div>

    <!-- Not role="menu": this panel has a heading and a rename field, and a menu
         may not contain a textbox. It is a labelled group of launchers. -->
    <div class="stack" id="stack" role="group"></div>

    <div class="menu hidden" id="ctx-menu" role="menu"></div>

    <script type="module" src="./dock.js"></script>
  </body>
</html>
