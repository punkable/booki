<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Booki</title>
    <link rel="stylesheet" href="./notch-shell.css" />
  </head>
  <body class="notch-body">
    <!-- One element that morphs: a slim tab at rest, a live activity while
         something plays, a small card on hover. Not a <button>, because the
         card holds its own play/pause button. -->
    <div class="notch-pill notch-enter" id="notch-pill" role="button" tabindex="0" title="Show Booki" aria-label="Show Booki">
      <div class="nl" aria-hidden="true">
        <span class="nl-art"><img id="nl-art-img" alt="" draggable="false" /></span>
        <span class="nl-eq"><i></i><i></i><i></i></span>
      </div>
      <div class="nc" id="notch-card">
        <span class="nc-art"><img id="nc-art-img" alt="" draggable="false" /></span>
        <span class="nc-copy">
          <span class="nc-title" id="nc-title"></span>
          <span class="nc-sub" id="nc-sub"></span>
        </span>
        <button class="nc-play" id="nc-play" type="button" hidden></button>
      </div>
    </div>
    <div class="notch-toast" id="notch-toast" role="status" aria-live="polite">
      <img class="notch-toast-mark" src="/brand/svg/isotype.svg" alt="" width="16" height="16" draggable="false" />
      <span class="notch-toast-copy">
        <span class="notch-toast-title" id="notch-toast-title"></span>
        <span class="notch-toast-sub" id="notch-toast-sub"></span>
      </span>
    </div>
    <script type="module" src="./notch.js"></script>
  </body>
</html>
