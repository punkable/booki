# Keep the three ecosystems patched: npm (frontend), cargo (backend) and the
# release workflow's actions. Weekly, batched, so update PRs stay manageable.
#
# Minor and patch updates arrive together; major updates come one PR per
# package, so a breaking API change never blocks the safe ones. For 0.x crates
# Dependabot calls 0.32 -> 0.39 "minor" even though it can break the build.
#
# The Tauri crates (cargo) and @tauri-apps/* (npm) must share major.minor
# (`npm run check:versions`). Dependabot cannot group across ecosystems, so
# when one side moves a Tauri minor, bump the other side in the same PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    # Booki only ships Windows builds. Tauri/Wry still records the Linux
    # GTK3/WebKitGTK stack in Cargo.lock, and that stack currently pins
    # gtk-rs/glib 0.18.x while RUSTSEC-2024-0429 is fixed in glib 0.20+.
    # Dependabot cannot raise this transitively without a Wry/Tauri GTK
    # migration, so keep normal Cargo updates on but suppress this one
    # non-shipped Linux binding until upstream can move past GTK3.
    ignore:
      - dependency-name: glib
    groups:
      # `windows` and `windows-core` must stay on the same release.
      windows-rs:
        patterns: [windows, windows-core]
      cargo-all:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-all:
        patterns: ["*"]
