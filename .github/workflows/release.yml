name: Release Booki (Windows)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching package.json (e.g. v0.80.0). Created on the dispatched commit if it does not exist yet."
        required: true
permissions:
  contents: read
concurrency:
  group: booki-release
  cancel-in-progress: false
jobs:
  # Exactly the same frontend/browser and Rust checks used by CI.
  checks:
    uses: ./.github/workflows/checks.yml
  release:
    needs: checks
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Validate tag, checkout and signing prerequisite
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          node scripts/check-versions.mjs "$tag"
          # A manual run may publish a version that has no tag yet: tag the
          # checked-out commit (after the version check above) so the release
          # has a source. A tag pushed with GITHUB_TOKEN starts no second run.
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            git tag "$tag" HEAD
            git push origin "refs/tags/$tag"
          fi
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$(git rev-parse HEAD)"
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Updater signing key is required."; exit 1; }
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Native Windows regression tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --target x86_64-pc-windows-msvc
      # Cross-compilation and packaging do not prove ARM64 runtime behavior.
      - name: Build signed x64 NSIS and MSI
        run: npm run tauri:build -- --target x86_64-pc-windows-msvc --bundles nsis,msi -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build signed ARM64 NSIS
        run: npm run tauri:build -- --target aarch64-pc-windows-msvc --bundles nsis -- --locked
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify signatures and prepare complete updater manifest
        run: node scripts/prepare-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: booki-signed-release
          path: dist/release-assets/*
          if-no-files-found: error
      # Upload/download and verify every draft asset before making it public.
      # Updater signatures are not Windows Authenticode signatures.
      - name: Publish verified draft
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Superseded installers become private drafts after verification.
      # Retain tags and source history; expose only the replacement release.
