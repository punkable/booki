name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  build:
    name: Package Windows ${{ matrix.arch }} (not runtime verification)
    needs: checks
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - arch: arm64
            target: aarch64-pc-windows-msvc
            bundles: nsis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Validate Windows performance script syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/measure-windows.ps1", [ref]$null, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - name: Native Windows tests
        if: matrix.arch == 'x64'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }}
      - run: npm ci
      # PRs (including forks) must build without production signing secrets.
      - name: Package without updater signatures
        shell: bash
        run: >-
          npm run tauri:build -- --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          -- --locked
      - name: Validate architecture bundle set
        run: node scripts/check-bundles.mjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: booki-windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
