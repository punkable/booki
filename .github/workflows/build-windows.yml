name: CI

# Two jobs on purpose:
#   checks — fast, on Linux: lint, localization, unit/smoke tests, web build.
#            This is the regression gate; it is where a broken dock is caught.
#   build  — slow, on Windows: proves the Rust/Win32 side still compiles and
#            produces installers. Only runs if `checks` passed, so a typo does
#            not burn a Windows runner for ten minutes.

on:
  # Only `main` on push. This used to be `branches: ["**"]`, which combined with
  # the pull_request trigger made every same-repo PR run the whole matrix twice.
  # Feature branches are covered by their pull request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth — the release workflow pins the same version, so the
  # artifact that ships is built on the toolchain the tests ran against.
  NODE_VERSION: 22

jobs:
  checks:
    name: Checks (lint, i18n, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check visible text encoding
        run: npm run check:text

      - name: Check icons and emoji assets
        run: npm run check:icons

      - name: Check localization parity
        run: npm run check:i18n

      - name: Build web assets
        run: npm run build

      - name: Install Chromium for the smoke tests
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (dock, notch, Settings)
        run: npm test

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failures
          path: tests/__screenshots__/
          if-no-files-found: ignore

  rust:
    name: Rust (clippy, fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # Linux compiles the cfg(not(windows)) side, so this checks the shared
      # logic (config, migrations, commands). The Win32 code is compiled by the
      # `build` job below.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build:
    name: Build (Windows)
    runs-on: windows-latest
    needs: [checks, rust]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app (installers + exe)
        run: npm run tauri:build
        env:
          # Required because createUpdaterArtifacts is enabled (signed updates).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: booki-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
