[package]
name = "booki-dock"
version = "0.87.1"
description = "Booki — a modern, lightweight dock for Windows"
authors = ["Booki"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "booki_dock_lib"
# Desktop-only app: the binary links this as a normal Rust library. The
# staticlib and cdylib artifacts come from Tauri's mobile template and are
# built, and thrown away, on every release.
crate-type = ["rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Ensure only one Booki runs: a second launch reveals the existing dock instead
# of opening a duplicate (dock + notch + tray).
tauri-plugin-single-instance = "2"
# Native drag-out: drag a file from the folder flyout into Explorer/other apps.
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
base64 = "0.23"
log = "0.4"
# System metrics for the dock widgets (CPU / memory / network). Cross-platform.
sysinfo = "0.39"
# Tiny HTTP client to fetch a website's favicon when pinning it as a widget.
ureq = "3"
# Verify and unpack optional plugins (plugins.rs).
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }

# Windows-only native integration (Win32 bindings + icon encoding).
[target.'cfg(windows)'.dependencies]
png = "0.18"
# Logitech HID++ battery over Bolt/Unifying receivers (win/logitech.rs).
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
windows-dpapi = "0.2"
# Decode the desktop wallpaper to derive an accent color from it.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "ApplicationModel",
    # Battery of Bluetooth headsets, mice and keyboards (win/devices.rs).
    "Devices_Enumeration_Pnp",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_WinRT",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Power",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "UI_Notifications",
    "Data_Xml_Dom",
    # Rounded acrylic behind the dock (win/material.rs).
    "Foundation_Numerics",
    "System",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_System_WinRT_Composition",
]

[target.'cfg(windows)'.dependencies.windows-core]
version = "0.62"

# Split out of `windows` in 0.62: Vector2 for the composition backdrop.
# IIterable from a Vec, for WinRT device property queries.
[target.'cfg(windows)'.dependencies.windows-collections]
version = "0.3"

[target.'cfg(windows)'.dependencies.windows-numerics]
version = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
